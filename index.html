<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Layout with Working Elements</title>
  <style>
    /* 1. Base Setup & Page Centering */
    body {
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column; /* Stacks leaderboard, card, and buttons vertically */
      justify-content: center; /* Centers the whole stack vertically */
      align-items: center;    /* Centers the whole stack horizontally */
      min-height: 100vh;
      background-color: #e0eafc;
      font-family: sans-serif;
      box-sizing: border-box;
    }

    /* 2. Leaderboard Styles */
    .leaderboard {
      background-color: #2c3e50;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 20px; /* Pushes the main card down */
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* 3. Main Centered Card Styles */
    .centered-card {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    /* 4. Button Container & Interactive Elements */
    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      position: relative; /* Safety measure for layer stacking */
      z-index: 10;        /* Ensures buttons stay on top and clickable */
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <!-- Top Element: Leaderboard -->
  <div class="leaderboard">
    <h3>🏆 Leaderboard: 1,250 pts</h3>
  </div>

  <!-- Center Element: Main Content Box -->
  <div class="centered-card">
    <h1>Game Dashboard</h1>
    <p>Everything is aligned, visible, and fully functional.</p>
    
    <!-- Nested Element: Interactive Buttons -->
    <div class="button-group">
      <button onclick="alert('Button 1 Works!')">Action 1</button>
      <button onclick="alert('Button 2 Works!')">Action 2</button>
    </div>
  </div>

</body>
</html>
