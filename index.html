<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swish Shot - 2D Basketball</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #222;
            display: block;
        }
        /* UI Overlay Systems */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        /* Active Screen Trigger */
        .active {
            display: flex;
        }
        /* Theme Styling for Main Menu */
        #mainMenu {
            background: linear-gradient(135deg, #ff6b2b 0%, #a83200 100%);
        }
        #mainMenu h1 {
            font-size: 4rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 2px;
            font-style: italic;
        }
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        /* Submenus Style */
        .submenu {
            background: rgba(20, 20, 20, 0.95);
            border: 3px solid #ff6b2b;
            border-radius: 12px;
            width: 90%;
            height: 90%;
        }
        .submenu-header {
            font-size: 2rem;
            color: #ff6b2b;
            margin: 15px 0;
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
        }
        /* Button Styles */
        .menu-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 35px;
            margin: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 0px #ccc;
            min-width: 180px;
            text-align: center;
        }
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #ff6b2b;
            background: #ff884d;
            color: white;
        }
        .menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0px #ff6b2b;
        }
        .back-btn {
            background: #555;
            color: white;
            box-shadow: 0 4px 0px #333;
            margin-top: auto;
            margin-bottom: 15px;
        }
        .back-btn:hover {
            background: #777;
            box-shadow: 0 6px 0px #444;
        }
        /* Content Layouts */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 0 20px;
            width: 100%;
            overflow-y: auto;
            max-height: 70%;
        }
        .flex-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 10px 40px;
        }
        .settings-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            width: 45%;
        }
        .settings-column h3 {
            margin-top: 0;
            color: #ff6b2b;
            border-bottom: 1px solid #ff6b2b;
            width: 100%;
            padding-bottom: 5px;
        }
        .setting-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .setting-item input[type="text"] {
            width: 80px;
            text-align: center;
            background: #333;
            color: #fff;
            border: 1px solid #ff6b2b;
            border-radius: 4px;
            padding: 3px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .setting-item select {
            background: #333;
            color: #fff;
            border: 1px solid #ff6b2b;
            padding: 5px;
            border-radius: 4px;
        }
        /* Skins Custom Cards */
        .skin-card {
            background: #252525;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .skin-card.equipped { border-color: #00ffcc; }
        .skin-card.owned { border-color: #ff6b2b; }
        .skin-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 5px 0;
        }
        .skin-name { font-weight: bold; font-size: 0.95rem; }
        .skin-ability { font-size: 0.75rem; color: #aaa; margin: 4px 0; min-height: 24px;}
        .skin-cost { font-size: 0.85rem; color: #ffbc00; font-weight: bold; display: flex; align-items: center; gap: 3px;}
        .skin-btn {
            background: #ff6b2b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .skin-btn.owned-btn { background: #444; }
        .skin-btn.equipped-btn { background: #00ffcc; color: black; }
        
        /* Stats Tracker top bar */
        .currency-display {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            color: #ffbc00;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }

        /* Leaderboard styling */
        .leaderboard-list {
            width: 80%;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            max-height: 65%;
            overflow-y: auto;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard-row.player-row {
            background: rgba(255, 107, 43, 0.2);
            color: #ff6b2b;
            font-weight: bold;
        }

        /* HUD & Pause Elements */
        #gameHUD {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
        #pauseBtn {
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #pauseMenu {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Currency Widget (Shared across menus) -->
        <div class="currency-display">🏀 <span id="ballCount">150</span></div>

        <!-- Canvas for Game Graphics -->
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Live Game HUD -->
        <div id="gameHUD">
            <div>MODE: <span id="hudMode">1v1</span> | BOTS: <span id="hudBotDiff">Normal</span></div>
            <div>SCORE: <span id="hudScore">0 - 0</span></div>
            <button id="pauseBtn" onclick="pauseGame()">║</button>
        </div>

        <!-- MAIN MENU -->
        <div id="mainMenu" class="screen-overlay active">
            <h1>Swish Shot</h1>
            <div class="subtitle">2D GitHub Basketball Arcade</div>
            <button class="menu-btn" onclick="startGame()">Play Match</button>
            <button class="menu-btn" onclick="showScreen('settingsMenu')">Settings</button>
            <button class="menu-btn" onclick="showScreen('skinsMenu')">Skins & Abilities</button>
            <button class="menu-btn" onclick="showScreen('leaderboardMenu')">Leaderboard</button>
        </div>

        <!-- SETTINGS MENU -->
        <div id="settingsMenu" class="screen-overlay">
            <div class="submenu flex-row" style="flex-direction: column; align-items: center; justify-content: flex-start;">
                <div class="submenu-header">Game Settings</div>
                
                <div class="flex-row" style="padding: 0; width: 100%; height: 65%;">
                    <!-- Match Configuration -->
                    <div class="settings-column">
                        <h3>Match Setup</h3>
                        <div class="setting-item">
                            <label>Match Mode:</label>
                            <select id="matchMode">
                                <option value="1v1">1 vs 1</option>
                                <option value="2v2">2 vs 2</option>
                                <option value="3v3">3 vs 3</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>Bot AI Difficulty:</label>
                            <select id="botDifficulty">
                                <option value="Random">Random Bot Mix</option>
                                <option value="Easy">Easy Only</option>
                                <option value="Normal">Normal Only</option>
                                <option value="Hard">Hard Only</option>
                            </select>
                        </div>
                        <div class="setting-item" style="font-size: 0.8rem; color: #aaa; text-align: center; width:100%">
                            Winning matches rewards 50 🏀!
                        </div>
                    </div>

                    <!-- Input Keybinds -->
                    <div class="settings-column">
                        <h3>Key Bindings</h3>
                        <div class="setting-item">
                            <label>Move Left:</label>
                            <input type="text" id="keyLeft" value="A" readonly onclick="bindKey('keyLeft')">
                        </div>
                        <div class="setting-item">
                            <label>Move Right:</label>
                            <input type="text" id="keyRight" value="D" readonly onclick="bindKey('keyRight')">
                        </div>
                        <div class="setting-item">
                            <label>Dribble Ball:</label>
                            <input type="text" id="keyDribble" value="S" readonly onclick="bindKey('keyDribble')">
                        </div>
                        <div class="setting-item">
                            <label>Shoot Hoop:</label>
                            <input type="text" id="keyShoot" value="W" readonly onclick="bindKey('keyShoot')">
                        </div>
                    </div>
                </div>

                <button class="menu-btn back-btn" onclick="showScreen('mainMenu')">Save & Back</button>
            </div>
        </div>

        <!-- SKINS MENU -->
        <div id="skinsMenu" class="screen-overlay">
            <div class="submenu" style="display: flex; flex-direction: column; align-items: center;">
                <div class="submenu-header">Skins Shop (15 Custom Abilities)</div>
                <div class="grid-container" id="skinsGrid">
                    <!-- Loaded dynamically via JavaScript -->
                </div>
                <button class="menu-btn back-btn" onclick="showScreen('mainMenu')">Back to Menu</button>
            </div>
        </div>

        <!-- LEADERBOARD MENU -->
        <div id="leaderboardMenu" class="screen-overlay">
            <div class="submenu" style="display: flex; flex-direction: column; align-items: center;">
                <div class="submenu-header">Global Bot Standings</div>
                <div class="leaderboard-list" id="leaderboardGrid">
                    <!-- Loaded dynamically via JavaScript -->
                </div>
                <button class="menu-btn back-btn" onclick="showScreen('mainMenu')">Back to Menu</button>
            </div>
        </div>

        <!-- PAUSE MENU OVERLAY -->
        <div id="pauseMenu" class="screen-overlay">
            <h1 style="color: #ff6b2b; font-size: 3rem; margin-bottom: 20px; text-transform: uppercase;">Game Paused</h1>
            <button class="menu-btn" onclick="resumeGame()">Resume Match</button>
            <button class="menu-btn" onclick="showScreen('settingsMenu')">Change Settings</button>
            <button class="menu-btn" onclick="exitToMenu()">Exit to Main Menu</button>
        </div>

    </div>

    <script>
        // Core Engine States
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'menu'; // 'menu', 'playing', 'paused'
        let previousState = 'menu'; // Tracks screen jumps for the setting window
        let basketballs = 150; // Starting money
        
        // Dynamic Keybind config status
        let bindingTarget = null;

        // Custom Keybind storage object
        let keybinds = {
            keyLeft: 'A',
            keyRight: 'D',
            keyDribble: 'S',
            keyShoot: 'W'
        };

        // Active match options
        let activeMatch = {
            mode: '1v1',
            difficulty: 'Normal',
            playerScore: 0,
            botScore: 0
        };

        // Complete database of 15 unique custom skins with colors and stats
        const skinsDatabase = [
            { id: 1, name: "Default Rookie", ability: "Standard handling stats", cost: 0, color: "#ff6b2b", purchased: true },
            { id: 2, name: "Air Phantom", ability: "+20% Higher Jump Reach", cost: 50, color: "#3a86ff", purchased: false },
            { id: 3, name: "Sonic Dribbler", ability: "+15% Sprint Speed Matrix", cost: 50, color: "#ff006e", purchased: false },
            { id: 4, name: "Laser Targeting", ability: "Shows accurate ball flight arc", cost: 100, color: "#8338ec", purchased: false },
            { id: 5, name: "Cyber Dunker", ability: "Slam dunks from 2x further out", cost: 100, color: "#00f5d4", purchased: false },
            { id: 6, name: "Ankle Breaker", ability: "Stuns close defensive AI bots", cost: 150, color: "#fee440", purchased: false },
            { id: 7, name: "Magnetic Hands", ability: "Steals ball smoothly from side", cost: 150, color: "#00bbf9", purchased: false },
            { id: 8, name: "Buzzer Master", ability: "Shots in final 10s count triple", cost: 200, color: "#9b5de5", purchased: false },
            { id: 9, name: "Iron Defense", ability: "Blocks cannot cause player falls", cost: 200, color: "#e63946", purchased: false },
            { id: 10, name: "Vortex Rim", ability: "Slightly pulls ball into basket hoop", cost: 250, color: "#f15bb5", purchased: false },
            { id: 11, name: "Ghost Step", ability: "Dash clean straight through defenders", cost: 250, color: "#00f5d4", purchased: false },
            { id: 12, name: "Meteor Striker", ability: "Powers ball rapidly down court line", cost: 300, color: "#ffb703", purchased: false },
            { id: 13, name: "Matrix Slow", ability: "Slow-motion physics during shot arc", cost: 350, color: "#70e000", purchased: false },
            { id: 14, name: "Golden King", ability: "Earns double currency rewards permanently", cost: 400, color: "#ffd700", purchased: false },
            { id: 15, name: "GitHub Octopus", ability: "Infinite reach control & legendary spin", cost: 500, color: "#ffffff", purchased: false }
        ];
        let equippedSkinId = 1;

        // Mock Database of Global Bot and Player Leaderboard
        let leaderboardData = [
            { name: "AlphaBot [Hard]", wins: 452 },
            { name: "CyberHooper [Hard]", wins: 389 },
            { name: "Matrix_AI [Normal]", wins: 294 },
            { name: "You (Player)", wins: 120, isPlayer: true },
            { name: "PixelDunker [Normal]", wins: 98 },
            { name: "RookieBot [Easy]", wins: 23 }
        ];

        // Screen routing architecture
        function showScreen(screenId) {
            // Keep track of where we came from if we went into settings
            if (screenId === 'settingsMenu') {
                if (gameState !== 'paused') previousState = 'menu';
            }

            // Hide all active menus safely
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('settingsMenu').classList.remove('active');
            document.getElementById('skinsMenu').classList.remove('active');
            document.getElementById('leaderboardMenu').classList.remove('active');
            document.getElementById('pauseMenu').classList.remove('active');
            document.getElementById('gameHUD').style.display = 'none';

            // Special router cases
            if (screenId === 'mainMenu') {
                gameState = 'menu';
                document.getElementById('mainMenu').classList.add('active');
            } else if (screenId === 'paused') {
                gameState = 'paused';
                document.getElementById('pauseMenu').classList.add('active');
            } else if (screenId === 'playing') {
                gameState = 'playing';
                document.getElementById('gameHUD').style.display = 'flex';
            } else {
                // Regular submenus
                document.getElementById(screenId).classList.add('active');
            }
        }

        // Live Application Initialization 
        function init() {
            updateCurrencyUI();
            buildSkinsShop();
            buildLeaderboard();
            
            // Listen for keypress changes for dynamic settings menu binding
            window.addEventListener('keydown', handleGlobalKeypress);
            
            // Start Canvas animation loop framework
            requestAnimationFrame(gameLoop);
        }

        function updateCurrencyUI() {
            document.getElementById('ballCount').innerText = basketballs;
        }

        // Dynamic Skin Builder engine
        function buildSkinsShop() {
            const grid = document.getElementById('skinsGrid');
            grid.innerHTML = '';

            skinsDatabase.forEach(skin => {
                const card = document.createElement('div');
                card.className = `skin-card`;
                if(skin.id === equippedSkinId) card.classList.add('equipped');
                else if(skin.purchased) card.classList.add('owned');

                let actionBtnText = `<button class="skin-btn" onclick="interactSkin(${skin.id})">Buy 🏀${skin.cost}</button>`;
                if (skin.id === equippedSkinId) {
                    actionBtnText = `<button class="skin-btn equipped-btn">Equipped</button>`;
                } else if (skin.purchased) {
                    actionBtnText = `<button class="skin-btn owned-btn" onclick="interactSkin(${skin.id})">Equip</button>`;
                }

                card.innerHTML = `
                    <div class="skin-icon" style="background: ${skin.color}; border: 2px solid #fff;"></div>
                    <div class="skin-name">${skin.name}</div>
                    <div class="skin-ability">${skin.ability}</div>
                    ${actionBtnText}
                `;
                grid.appendChild(card);
            });
        }

        function interactSkin(id) {
            const skin = skinsDatabase.find(s => s.id === id);
            if (!skin) return;

            if (!skin.purchased) {
                // Attempt to buy
                if (basketballs >= skin.cost) {
                    basketballs -= skin.cost;
                    skin.purchased = true;
                    equippedSkinId = skin.id;
                    alert(`Successfully unlocked and equipped: ${skin.name}!`);
                } else {
                    alert("Not enough basketballs! Win more matches to earn 50 per victory.");
                }
            } else {
                // Toggle equipped
                equippedSkinId = skin.id;
            }
            updateCurrencyUI();
            buildSkinsShop();
        }

        // Dynamic Leaderboard population setup
        function buildLeaderboard() {
            const container = document.getElementById('leaderboardGrid');
            container.innerHTML = '';
            
            // Sort standard data values descending
            leaderboardData.sort((a,b) => b.wins - a.wins);

            leaderboardData.forEach((row, index) => {
                const item = document.createElement('div');
                item.className = `leaderboard-row ${row.isPlayer ? 'player-row' : ''}`;
                item.innerHTML = `
                    <span>#${index + 1} ${row.name}</span>
                    <span>${row.wins} Wins</span>
                `;
                container.appendChild(item);
            });
        }

        // Dynamic setting system binding execution hooks
        function bindKey(targetID) {
            bindingTarget = targetID;
            const inputField = document.getElementById(targetID);
            inputField.value = "PRESS KEY...";
            inputField.style.borderColor = "#00ffcc";
        }

        function handleGlobalKeypress(e) {
            if (bindingTarget) {
                e.preventDefault();
                let chosenKey = e.key.toUpperCase();
                if (chosenKey === " ") chosenKey = "SPACE";
                
                keybinds[bindingTarget] = chosenKey;
                
                const element = document.getElementById(bindingTarget);
                element.value = chosenKey;
                element.style.borderColor = "#ff6b2b";
                bindingTarget = null;
            } else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                // Bind quick escape key to handle real-time pauses safely
                if (gameState === 'playing') {
                    pauseGame();
                } else if (gameState === 'paused') {
                    resumeGame();
                }
            }
        }

        // Gameplay control systems
        function startGame() {
            // Pull configuration setup variables right out of user selections form fields
            activeMatch.mode = document.getElementById('matchMode').value;
            
            const diffSelect = document.getElementById('botDifficulty').value;
            if(diffSelect === 'Random') {
                const choices = ['Easy', 'Normal', 'Hard'];
                activeMatch.difficulty = choices[Math.floor(Math.random() * choices.length)] + " (Mixed)";
            } else {
                activeMatch.difficulty = diffSelect;
            }

            // Zero baseline game metrics
            activeMatch.playerScore = 0;
            activeMatch.botScore = 0;

            // Push values out live directly onto the user graphic layout system fields
            document.getElementById('hudMode').innerText = activeMatch.mode;
            document.getElementById('hudBotDiff').innerText = activeMatch.difficulty;
            document.getElementById('hudScore').innerText = `${activeMatch.playerScore} - ${activeMatch.botScore}`;

            showScreen('playing');
        }

        function pauseGame() {
            previousState = 'paused';
            showScreen('paused');
        }

        function resumeGame() {
            showScreen('playing');
        }

        function exitToMenu() {
            if(confirm("Are you sure you want to forfeit this match?")) {
                showScreen('mainMenu');
            }
        }

        // Canvas animation background loop framework
        function gameLoop() {
            // Refresh screen view window size cleanly
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'playing') {
                drawCourtEnvironment();
            } else {
                drawMenuBackground();
            }

            requestAnimationFrame(gameLoop);
        }

        function drawMenuBackground() {
            // Draw an abstract canvas graphic system so screen isn't pitch black behind windows
            ctx.fillStyle = '#1e1e24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw a subtle design shape onto the canvas
            ctx.fillStyle = 'rgba(255, 107, 43, 0.05)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 200, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCourtEnvironment() {
            // Hardwood floor base background color line
            ctx.fillStyle = '#bc6c25';
            ctx.fillRect(0, 420, canvas.width, 80);
            
            // Court painted floor accent line lines markings
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 420, canvas.width - 100, 1);
            
            // Three point line system arc circle mapping paths
            ctx.beginPath();
            ctx.arc(800, 420, 220, Math.PI, 1.5 * Math.PI);
            ctx.stroke();

            // Basketball Hoop Stand poles right-side layout placements
            ctx.fillStyle = '#495057';
            ctx.fillRect(740, 180, 15, 240); // Main Pole
            ctx.fillRect(700, 180, 40, 10);  // Support Arm
            
            // Backboard graphics box
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(690, 130, 10, 80);
            ctx.strokeStyle = '#e63946';
            ctx.strokeRect(690, 150, 10, 40);

            // Orange Rim structure loop hook 
            ctx.fillStyle = '#ff4d00';
            ctx.fillRect(650, 175, 40, 8);

            // Net paths
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(652, 183);
            ctx.lineTo(658, 210);
            ctx.lineTo(682, 210);
            ctx.lineTo(688, 183);
            ctx.stroke();

            // Render Player Avatar inside screen area boundaries layout tracking
            const userColor = skinsDatabase.find(s => s.id === equippedSkinId)?.color || '#ff6b2b';
            ctx.fillStyle = userColor;
            ctx.beginPath();
            ctx.arc(200, 390, 25, 0, Math.PI * 2); // Player safe circle boundary point
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Label player node tag overlay
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText("YOU", 188, 350);

            // Render a bouncing basketball preview system object element onto surface grid
            let ballY = 390 + Math.sin(Date.now() * 0.007) * 20; 
            ctx.fillStyle = '#ff6b2b';
            ctx.beginPath();
            ctx.arc(245, ballY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Instructions text overlay helper node
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`Press keys [${keybinds.keyLeft}], [${keybinds.keyRight}], [${keybinds.keyShoot}], [${keybinds.keyDribble}] to test bindings.`, canvas.width/2, 80);
            ctx.fillText("Demo Match Active! Use the interface controls or the top corner button to pause.", canvas.width/2, 105);
            ctx.textAlign = 'left'; // reset standard mapping rules paths
        }

        // Initialize script logic cleanly on initial browser frame runtime load windows hooks
        window.onload = init;
    </script>
</body>
</html>
